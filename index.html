<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семейный Доктор | Онбординг</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <div class="app-container">
        
        <!-- ЭКРАН ВХОДА (АВТОРИЗАЦИЯ) -->
        <div id="auth-screen" class="auth-screen">
            <div class="auth-card">
                <div class="auth-logo">АО «Семейный доктор»</div>
                <h2>Личный кабинет адаптации</h2>
                <p>Введите вашу фамилию для входа в план онбординга</p>
                <input type="text" id="search-lastname" placeholder="Например: Колегова" autocomplete="off">
                <button id="btn-login" onclick="loginEmployee()">Войти в систему</button>
                <div id="auth-error" class="auth-error"></div>
            </div>
        </div>

        <!-- ОСНОВНОЙ ЭКРАН ПРИЛОЖЕНИЯ (Изначально скрыт) -->
        <div id="main-app-screen" style="display: none;">
            <!-- Шапка профиля -->
            <header class="app-header">
                <div class="logo">АО «Семейный доктор»</div>
                <div class="user-info">
                    <h1 id="user-name">Загрузка...</h1>
                    <p id="user-role">...</p>
                    <div class="branch" id="user-branch">...</div>
                </div>
                <!-- Прогресс ИС -->
                <div class="progress-container">
                    <div class="progress-text">Прогресс испытательного срока: <span id="progress-val">0%</span></div>
                    <div class="progress-bar"><div id="progress-fill" style="width: 0%"></div></div>
                </div>
                <button class="btn-logout" onclick="logoutEmployee()">Выйти из кабинета</button>
            </header>

            <!-- Главный экран задач -->
            <main class="app-main">
                <h2 class="section-title">🗓 Мой индивидуальный план</h2>
                <div id="tasks-list" class="tasks-list">
                    <!-- Сюда код подставит задачи динамически -->
                </div>
            </main>
        </div>

    </div>
    <script src="app.js?v=4"></script>
</body>
</html>
