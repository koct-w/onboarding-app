<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семейный Доктор | Онбординг</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Шапка профиля -->
        <header class="app-header">
            <div class="logo">АО «Семейный доктор»</div>
            <div class="user-info">
                <h1 id="user-name">Загрузка плана...</h1>
                <p id="user-role">Пожалуйста, подождите</p>
                <div class="branch" id="user-branch">Синхронизация данных</div>
            </div>
            <!-- Прогресс ИС -->
            <div class="progress-container">
                <div class="progress-text">Прогресс испытательного срока: <span id="progress-val">0%</span></div>
                <div class="progress-bar"><div id="progress-fill" style="width: 0%"></div></div>
            </div>
        </header>

        <!-- Главный экран задач -->
        <main class="app-main">
            <h2 class="section-title">🗓 Мой план адаптации</h2>
            <div id="tasks-list" class="tasks-list">
                <!-- Сюда код автоматически подставит задачи из таблицы -->
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
